<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartridge Request Lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1040px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · issue #4</p>
    <h1>One request through the CartridgeConnector</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vllm-cartridge-sequence-title vllm-cartridge-sequence-desc">
        <title id="vllm-cartridge-sequence-title">Cartridge request lifecycle in vLLM</title>
        <desc id="vllm-cartridge-sequence-desc">A chat request reaches the engine with p placeholder tokens and a cartridge id; the scheduler-side connector reports those p tokens as external and allocates blocks, the worker-side connector loads the cartridge from the volume on a store miss, writes its K/V and DeltaNet state into the blocks, and decoding streams tokens back to the gateway.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Fragment frame: opt [not in GPU store] (behind everything else) -->
        <rect x="664" y="376" width="284" height="100" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="664" y="376" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="684" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
        <text x="736" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[not in GPU store]</text>

        <!-- Lifelines -->
        <line x1="120" y1="152" x2="120" y2="652" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="320" y1="152" x2="320" y2="652" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="520" y1="152" x2="520" y2="652" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="720" y1="152" x2="720" y2="652" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="920" y1="152" x2="920" y2="652" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Activation bars -->
        <rect x="116" y="184" width="8" height="456" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="316" y="192" width="8" height="440" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="516" y="232" width="8" height="132" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="716" y="360" width="8" height="236" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="916" y="432" width="8" height="28" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- Messages (top → down) -->
        <!-- 1 gateway → engine -->
        <line x1="124" y1="192" x2="316" y2="192" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- 2 engine → scheduler -->
        <line x1="324" y1="232" x2="516" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 3 scheduler self: get_num_new_matched_tokens -->
        <path d="M 524,268 H 552 Q 560,268 560,276 V 280 Q 560,288 552,288 H 526" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 4 scheduler self: update_state_after_alloc -->
        <path d="M 524,308 H 552 Q 560,308 560,316 V 320 Q 560,328 552,328 H 526" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 5 scheduler → worker: build_connector_meta -->
        <line x1="524" y1="360" x2="716" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 6 worker → volume -->
        <line x1="724" y1="432" x2="916" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 7 volume → worker (return) -->
        <line x1="916" y1="460" x2="724" y2="460" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- 8 worker self: start_load_kv (headline) -->
        <path d="M 724,504 H 752 Q 760,504 760,512 V 516 Q 760,524 752,524 H 726" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- 9 worker self: forward from position p -->
        <path d="M 724,548 H 752 Q 760,548 760,556 V 560 Q 760,568 752,568 H 726" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 10 worker → engine (return) -->
        <line x1="716" y1="592" x2="324" y2="592" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- 11 engine → gateway (return) -->
        <line x1="316" y1="632" x2="124" y2="632" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Message labels -->
        <rect x="188" y="172" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="220" y="181" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GENERATE</text>

        <rect x="380" y="212" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="420" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADD REQUEST</text>

        <rect x="568" y="272" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="572" y="281" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">MATCH P TOKENS</text>

        <rect x="568" y="312" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="572" y="321" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">ALLOC BLOCKS</text>

        <rect x="572" y="340" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="349" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONNECTOR META</text>

        <rect x="780" y="412" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="820" y="421" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ EXPORT</text>

        <rect x="792" y="440" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="820" y="449" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TENSORS</text>

        <rect x="768" y="508" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="772" y="517" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">WRITE KV+STATE</text>

        <rect x="768" y="552" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="772" y="561" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">DECODE FROM P</text>

        <rect x="576" y="572" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="581" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOKEN DELTAS</text>

        <rect x="176" y="612" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="220" y="621" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TEXT + TOKENS</text>

        <!-- Actors -->
        <rect x="36" y="96" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="36" y="96" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="120" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gateway</text>
        <text x="120" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cartridge-vllm</text>

        <rect x="236" y="96" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="236" y="96" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CartridgeEngine</text>
        <text x="320" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AsyncLLM front</text>

        <rect x="436" y="96" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="436" y="96" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="520" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scheduler</text>
        <text x="520" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">connector · scheduler</text>

        <rect x="636" y="96" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="636" y="96" width="168" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="720" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GPU worker</text>
        <text x="720" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">connector · worker</text>

        <rect x="836" y="96" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="836" y="96" width="168" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="920" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Volume</text>
        <text x="920" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vllm/state.safetensors</text>

        <!-- Legend strip -->
        <line x1="40" y1="672" x2="1000" y2="672" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="688" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="700" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="708" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">New connector code</text>

        <rect x="180" y="700" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="200" y="708" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Process</text>

        <rect x="268" y="700" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="288" y="708" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

        <line x1="348" y1="706" x2="376" y2="706" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="384" y="708" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Modal call</text>

        <line x1="468" y1="706" x2="496" y2="706" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="504" y="708" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Call</text>

        <line x1="560" y1="706" x2="588" y2="706" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="596" y="708" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return / stream</text>

        <line x1="700" y1="706" x2="728" y2="706" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="736" y="708" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Cartridge enters the cache</text>
      </svg>
    </div>
  </div>
</body>
</html>
