<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartridges on vLLM</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1040px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · issue #4</p>
    <h1>Serving cartridges on vLLM through a KV connector</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vllm-cartridge-architecture-title vllm-cartridge-architecture-desc">
        <title id="vllm-cartridge-architecture-title">Serving cartridges on vLLM</title>
        <desc id="vllm-cartridge-architecture-desc">A trained cartridge is exported to a vLLM-ready layout on the volume; chat requests flow through the gateway to a vLLM engine whose CartridgeConnector loads that export into the paged KV and DeltaNet state blocks before decoding.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Row eyebrows -->
        <text x="40" y="80" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DEPLOY · ONCE PER CARTRIDGE</text>
        <text x="40" y="264" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SERVE · EVERY REQUEST</text>

        <!-- Zone: CartridgeEngine (bg → zones → arrows → nodes) -->
        <rect x="472" y="216" width="520" height="248" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="488" y="220" width="168" height="12" rx="2" fill="#f5f5f5"/>
        <text x="572" y="229" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CARTRIDGEENGINE · MODAL H200</text>

        <!-- Arrows -->
        <!-- deploy row -->
        <line x1="232" y1="128" x2="400" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="592" y1="128" x2="760" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- export → connector (read on a store miss) -->
        <line x1="864" y1="160" x2="864" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- clients ↔ gateway -->
        <line x1="184" y1="304" x2="248" y2="304" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 248,328 H 184" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- gateway ↔ engine -->
        <line x1="408" y1="304" x2="496" y2="304" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 496,328 H 408" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- scheduler asks connector -->
        <line x1="688" y1="296" x2="760" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- connector writes blocks (headline) -->
        <line x1="864" y1="320" x2="864" y2="376" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- forward pass attends over the blocks -->
        <path d="M 592,344 V 400 Q 592,408 600,408 H 760" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels (masked, 8px gap from strokes) -->
        <rect x="292" y="108" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="316" y="117" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ</text>

        <rect x="632" y="108" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="676" y="117" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BF16 · LAYOUT</text>

        <rect x="872" y="180" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="914" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOAD ON MISS</text>

        <rect x="196" y="284" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="216" y="293" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

        <rect x="200" y="336" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="216" y="345" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SSE</text>

        <rect x="416" y="284" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="452" y="293" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOKENS + ID</text>

        <rect x="424" y="336" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="452" y="345" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STREAM</text>

        <rect x="696" y="276" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="724" y="285" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MATCH P</text>

        <rect x="872" y="342" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="904" y="351" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WRITE K/V</text>

        <rect x="648" y="388" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="674" y="397" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ATTEND</text>

        <!-- Nodes -->
        <!-- Trained cartridge (store) -->
        <rect x="40" y="96" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="96" width="192" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="48" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="62" y="113" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VOL</text>
        <text x="136" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trained cartridge</text>
        <text x="136" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cartridge.safetensors · fp32</text>

        <!-- Export step (backend) -->
        <rect x="400" y="96" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="96" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="408" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="422" y="113" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CPU</text>
        <text x="496" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Export for vLLM</text>
        <text x="496" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cartridge_export_vllm</text>

        <!-- Engine-ready export (store) -->
        <rect x="760" y="96" width="208" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="96" width="208" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="768" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="782" y="113" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VOL</text>
        <text x="864" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Engine-ready export</text>
        <text x="864" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vllm/ · manifest + sha256</text>

        <!-- Clients (input) -->
        <rect x="40" y="280" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="280" width="144" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="288" width="32" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="64" y="297" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="112" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Demo · LibreChat</text>
        <text x="112" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OpenAI chat API</text>

        <!-- Gateway (backend) -->
        <rect x="248" y="280" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="248" y="280" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="256" y="288" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="270" y="297" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="328" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gateway</text>
        <text x="328" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:8008 · cartridge-vllm</text>

        <!-- vLLM AsyncLLM (backend) -->
        <rect x="496" y="280" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="496" y="280" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="504" y="288" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="518" y="297" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GPU</text>
        <text x="592" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">vLLM AsyncLLM</text>
        <text x="592" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Qwen3.8-27B · bf16</text>

        <!-- CartridgeConnector (focal) -->
        <rect x="760" y="256" width="208" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="256" width="208" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="768" y="264" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="782" y="273" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEW</text>
        <text x="864" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CartridgeConnector</text>
        <text x="864" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">KVConnectorBase_V1 · HMA</text>

        <!-- Paged KV + state (store) -->
        <rect x="760" y="376" width="208" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="376" width="208" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="768" y="384" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="782" y="393" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HBM</text>
        <text x="864" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Paged KV + state</text>
        <text x="864" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">16 attn · 48 DeltaNet</text>

        <!-- Legend strip -->
        <line x1="40" y1="492" x2="1000" y2="492" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="524" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">New component</text>

        <rect x="164" y="524" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="184" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Service / step</text>

        <rect x="284" y="524" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="304" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

        <rect x="356" y="524" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="376" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Client</text>

        <line x1="440" y1="530" x2="468" y2="530" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="476" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Request</text>

        <line x1="548" y1="530" x2="576" y2="530" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="584" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Cartridge load</text>

        <line x1="680" y1="530" x2="708" y2="530" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="716" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data / call</text>

        <line x1="800" y1="530" x2="828" y2="530" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="836" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Token stream</text>
      </svg>
    </div>
  </div>
</body>
</html>
