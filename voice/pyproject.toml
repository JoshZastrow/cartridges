[project]
name = "voice"
version = "0.1.0"
description = "Duplex speech cartridge: a trained KV prefix for PersonaPlex and hertz-dev"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fermion-research>=0.2.15",  # Phonon-2 ASR
    "modal>=1.5.6.dev19",
    "moshi-personaplex @ git+https://github.com/NVIDIA/personaplex@3428dfd95309a7f3c84fd93259ded0f810d1ff91#subdirectory=moshi",
    "numpy>=2",
    "pocket-tts>=4.0.1",
    "pydantic>=2.14.0b2",
    "safetensors>=0.4",
    "shared",
    "soundfile>=0.13",
    "torch>=2.14.1",
    "wandb>=0.30.0",
]

[project.optional-dependencies]
# hertz-dev serving (#21). hertz-dev runs on the workspace torch; upstream's code is cloned
# into the Modal image (voice.deploy_hertz.image), as it is not a package.
hertz = ["aiohttp>=3.10.5", "fastapi>=0.115", "uvicorn>=0.32", "websockets>=13", "scipy>=1.13"]

[project.scripts]
voice = "voice.cli:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.0.0"]

[tool.uv.sources]
shared = { workspace = true }
