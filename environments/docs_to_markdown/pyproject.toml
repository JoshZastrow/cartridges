[project]
name = "docs-to-markdown"
description = "Convert a directory of source documents (pdf/docx/html/txt/images) into markdown, verified by the output file existing and being non-empty"
tags = ["data-generation", "tool-use", "train", "eval"]
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "verifiers==0.3.2.dev99",
    "cartridges",
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
cartridges = { path = "../../", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["docs_to_markdown/**", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
