[project]
name = "cartridges"
version = "0.1.0"
description = "Training and Serving Platform for cartridges"
readme = "README.md"
authors = [
    { name = "Josh Zastrow", email = "j.a.zastrow.jr@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.154",
    "datasets>=5.0.1",
    "fire>=0.7.1",
    "jiwer>=4.0.0",
    "modal>=1.5.6.dev19",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "prefect>=3.0.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.14.0b2",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.2",
    "verifiers==0.3.2.dev99",
    "wandb>=0.30.0",
    "weave>=0.53.9",
]

[project.scripts]
cartridges = "cartridges.cli:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
prerelease = "allow"

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "pytest>=9.0.0",
]
