[project]
name = "cartridges"
version = "0.1.0"
description = "Training and Serving Platform for cartridges"
readme = "README.md"
authors = [
    { name = "Josh Zastrow", email = "j.a.zastrow.jr@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.154",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "fire>=0.7.1",
    "httpx>=0.28.1",
    "jiwer>=4.0.0",
    "modal>=1.5.6.dev19",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "prefect>=3.0.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.14.0b2",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.2",
    "uvicorn>=0.53.0",
    "verifiers==0.3.2.dev99",
    "wandb>=0.30.0",
    "weave>=0.53.9",
]

[project.scripts]
cartridges = "cartridges.cli:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
prerelease = "allow"
override-dependencies = ["torch>=2.14.1", "numpy>=2", "huggingface-hub>=1", "safetensors>=0.4", "aiohttp>=3.10.5", "einops>=0.7", "sentencepiece>=0.2", "transformers>=5.10.4,<5.18"]

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "pytest>=9.0.0",
    "torch>=2.14.1",
    "transformers>=5.10.4,<5.18",
    "wandb-workspaces>=0.4.13",
]

[tool.uv.workspace]
members = ["voice", "shared"]
