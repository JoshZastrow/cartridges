[project]
name = "cartridges"
version = "0.1.0"
description = "Training and Serving Platform for cartridges"
readme = "README.md"
authors = [
    { name = "Josh Zastrow", email = "j.a.zastrow.jr@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
cartridges = "cartridges:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.24.2",
]
